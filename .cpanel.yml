---
deployment:
  tasks:
    - export DEPLOYPATH=$HOME/public_html
    - /bin/cp public/index.html $DEPLOYPATH
    - /bin/cp public/styles.css $DEPLOYPATH
    - /bin/cp public/app.js $DEPLOYPATH
    - /bin/cp public/admin.html $DEPLOYPATH
    - /bin/cp public/admin.js $DEPLOYPATH
    - /bin/cp public/admin.css $DEPLOYPATH
    - /bin/cp .htaccess $DEPLOYPATH
    - mkdir -p tmp data
    - /bin/touch tmp/restart.txt
